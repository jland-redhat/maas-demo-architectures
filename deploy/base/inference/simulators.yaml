# Lightweight LLMInferenceService simulators (CPU, no GPU).
# Pattern matches upstream: https://github.com/opendatahub-io/models-as-a-service/tree/main/docs/samples/models/simulator
# Image: ghcr.io/llm-d/llm-d-inference-sim — each logical "model" is a separate InferenceService for MaaS routing demos.
# Context: --max-model-len 32768 (simulator default is 1024). Not mirrored on MaaSModelRef
# (opendatahub.io/context-window breaks Gen AI BFF — string annotation vs int JSON field).
# HTTP: --log-http (https://github.com/llm-d/llm-d-inference-sim/pull/470).
# Tokenization: --force-dummy-tokenizer so v0.10+ works without a vLLM render sidecar.
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: granite-3-8b-instruct
  namespace: llm
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
    maas.demo/model-family: granite
spec:
  model:
    uri: hf://sshleifer/tiny-gpt2
    name: ibm/granite-3-8b-instruct
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
        imagePullPolicy: Always
        command: ["/app/llm-d-inference-sim"]
        args:
          - --port
          - "8000"
          - --model
          - ibm/granite-3-8b-instruct
          - --mode
          - random
          # Default max-model-len is 1024; raise for realistic demo context windows.
          - --max-model-len
          - "32768"
          - --log-http
          - --force-dummy-tokenizer
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
        ports:
          - name: https
            containerPort: 8000
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: https
            scheme: HTTPS
