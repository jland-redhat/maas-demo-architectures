# Register each simulator with MaaS (namespace models-as-a-service policies reference llm + name).
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: granite-3-8b-instruct
  namespace: llm
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
  annotations:
    openshift.io/display-name: "IBM Granite 3.8B Instruct (simulated)"
spec:
  modelRef:
    kind: LLMInferenceService
    name: granite-3-8b-instruct
---
