# Register each simulator with MaaS (namespace models-as-a-service policies reference llm + name).
# openshift.io/display-name → modelDetails.displayName (AI Assets / Gen AI Studio labels).
# Do not set opendatahub.io/context-window: K8s annotations are strings, but Gen AI BFF
# expects modelDetails.contextWindow as a JSON number and 502s the whole MaaS list if present.
# Simulator max length is still set via --max-model-len on the LLMInferenceService pods.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: granite-3-8b-instruct
  namespace: llm
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
  annotations:
    openshift.io/display-name: "IBM Granite 3.8B Instruct (simulated)"
spec:
  modelRef:
    kind: LLMInferenceService
    name: granite-3-8b-instruct
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: llama-3-1-8b-instruct
  namespace: llm
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
  annotations:
    openshift.io/display-name: "Meta Llama 3.1 8B Instruct (simulated)"
spec:
  modelRef:
    kind: LLMInferenceService
    name: llama-3-1-8b-instruct
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: mistral-7b-instruct-v03
  namespace: llm
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
  annotations:
    openshift.io/display-name: "Mistral 7B Instruct v0.3 (simulated)"
spec:
  modelRef:
    kind: LLMInferenceService
    name: mistral-7b-instruct-v03
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
