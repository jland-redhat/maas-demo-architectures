# Demo 07: Minimal agent entitlement — one subscription + policy for Llama, owned by
# maas-demo-apps (bob). OpenClaw consumes the MaaS OpenAI-compatible endpoint using a
# user-minted sk-oai-* API key (see README). Namespace: models-as-a-service (MaasTenantConfig).
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo07-agent-llama
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 07 — OpenClaw agent (Llama quota)"
    openshift.io/description: "Quota envelope for app-team agent workloads calling Llama via MaaS"
spec:
  owner:
    groups:
      - name: maas-admin
      - name: maas-demo-apps
    users: []
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 500
          window: 1m
  priority: 30
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo07-agent-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 07 — OpenClaw agent access (Llama)"
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-apps
    users: []
