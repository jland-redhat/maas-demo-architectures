# Default-tenant entitlement for the live Vertex Claude model.
# Lives in models-as-a-service (MaasTenantConfig present).
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo08-vertex-claude
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Vertex Claude Opus 4.8"
    openshift.io/description: "Live Vertex AI Anthropic Claude (default tenant)"
spec:
  owner:
    groups:
      - name: maas-admin
      - name: maas-demo-research
    users: []
  modelRefs:
    - name: vertex-claude-opus-4-8
      namespace: llm
      tokenRateLimits:
        - limit: 100
          window: 1m
  priority: 45
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo08-vertex-claude-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Vertex Claude Opus 4.8 access"
spec:
  modelRefs:
    - name: vertex-claude-opus-4-8
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-research
    users: []
