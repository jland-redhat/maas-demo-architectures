# Demo 08 — partner tenant models.
# Gateway ref: partner (openshift-ingress) — create via scripts/apply-partner-tenant.sh first.
#
# Intentional split (fix vs control for MaasTenantConfig co-location):
#   - partner-mistral-7b  → LLMIS + MaaSModelRef in ai-tenant-partner (same ns as MaasTenantConfig)
#   - partner-llama-3-1-8b → LLMIS + MaaSModelRef stay in llm-partner (pre-fix layout for A/B)
# MaaSModelRef looks up LLMInferenceService in its own namespace (no cross-ns modelRef.name).
---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-partner
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
    maas.demo/tenant: partner
    istio-injection: enabled
---
# --- Fixed layout: Mistral lives with MaasTenantConfig ---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: partner-mistral-7b
  namespace: ai-tenant-partner
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
    maas.demo/tenant: partner
    maas.demo/model-family: mistral
    maas.demo/layout: tenant-colocated
  annotations:
    openshift.io/display-name: "Mistral 7B Instruct (simulated)"
spec:
  model:
    uri: hf://sshleifer/tiny-gpt2
    name: mistralai/mistral-7b-instruct-v0.3
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: partner
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
        imagePullPolicy: Always
        command: ["/app/llm-d-inference-sim"]
        args:
          - --port
          - "8000"
          - --model
          - mistralai/mistral-7b-instruct-v0.3
          - --mode
          - random
          - --max-model-len
          - "32768"
          - --log-http
          - --force-dummy-tokenizer
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
        ports:
          - name: https
            containerPort: 8000
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: https
            scheme: HTTPS
---
# --- Control: Llama stays in dedicated model ns (llm-partner) ---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: partner-llama-3-1-8b
  namespace: llm-partner
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
    maas.demo/tenant: partner
    maas.demo/model-family: llama
    maas.demo/layout: model-namespace
  annotations:
    openshift.io/display-name: "Llama 3.1 8B Instruct (simulated)"
spec:
  model:
    uri: hf://sshleifer/tiny-gpt2
    name: meta/llama-3.1-8b-instruct
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: partner
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
        imagePullPolicy: Always
        command: ["/app/llm-d-inference-sim"]
        args:
          - --port
          - "8000"
          - --model
          - meta/llama-3.1-8b-instruct
          - --mode
          - random
          - --max-model-len
          - "32768"
          - --log-http
          - --force-dummy-tokenizer
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
        ports:
          - name: https
            containerPort: 8000
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: https
            scheme: HTTPS
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: partner-mistral-7b
  namespace: ai-tenant-partner
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
    maas.demo/tenant: partner
    maas.demo/layout: tenant-colocated
  annotations:
    openshift.io/display-name: "Mistral 7B Instruct (simulated)"
spec:
  tenantRef: partner
  modelRef:
    kind: LLMInferenceService
    name: partner-mistral-7b
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: partner-llama-3-1-8b
  namespace: llm-partner
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
    maas.demo/tenant: partner
    maas.demo/layout: model-namespace
  annotations:
    openshift.io/display-name: "Llama 3.1 8B Instruct (simulated)"
spec:
  tenantRef: partner
  modelRef:
    kind: LLMInferenceService
    name: partner-llama-3-1-8b
