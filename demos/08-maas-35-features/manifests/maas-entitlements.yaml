# Demo 08: Hybrid catalog — on-cluster Granite + llm-katan external sims for research.
# Entitlements must live in the default tenant namespace (MaasTenantConfig present).
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo08-hybrid-catalog
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Research hybrid catalog (on-cluster + external)"
    openshift.io/description: "Quota for research on Granite and llm-katan external simulators"
spec:
  owner:
    groups:
      - name: maas-admin
      - name: maas-demo-research
    users: []
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 500
          window: 1m
    - name: sim-chat
      namespace: llm
      tokenRateLimits:
        - limit: 200
          window: 1m
    - name: sim-chat-2
      namespace: llm
      tokenRateLimits:
        - limit: 200
          window: 1m
    - name: sim-messages
      namespace: llm
      tokenRateLimits:
        - limit: 200
          window: 1m
    - name: sim-stream
      namespace: llm
      tokenRateLimits:
        - limit: 200
          window: 1m
  priority: 40
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo08-hybrid-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Research hybrid catalog access"
spec:
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
    - name: sim-chat
      namespace: llm
    - name: sim-chat-2
      namespace: llm
    - name: sim-messages
      namespace: llm
    - name: sim-stream
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-research
    users: []
