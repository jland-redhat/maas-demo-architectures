    maas.demo/model-family: gpt
  annotations:
    openshift.io/display-name: "GPT-OSS 20B (simulated)"
spec:
  model:
    uri: hf://sshleifer/tiny-gpt2
    name: openai/gpt-oss-20b
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: oidc
