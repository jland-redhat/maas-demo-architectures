    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
        imagePullPolicy: Always
        command: ["/app/llm-d-inference-sim"]
        args:
          - --port
          - "8000"
          - --model
          - openai/gpt-oss-20b
          - --mode
          - random
          - --max-model-len
          - "32768"
          - --log-http
          - --force-dummy-tokenizer
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
