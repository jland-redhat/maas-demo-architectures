            scheme: HTTPS
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: oidc-qwen-2-5-7b
  namespace: llm-oidc
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
    maas.demo/tenant: oidc
  annotations:
    openshift.io/display-name: "Qwen 2.5 7B Instruct"
spec:
  tenantRef: oidc
  modelRef:
    kind: LLMInferenceService
    name: oidc-qwen-2-5-7b
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: oidc-gpt-oss-20b
  namespace: llm-oidc
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
    maas.demo/tenant: oidc
  annotations:
    openshift.io/display-name: "GPT-OSS 20B"
spec:
  tenantRef: oidc
  modelRef:
    kind: LLMInferenceService
    name: oidc-gpt-oss-20b
