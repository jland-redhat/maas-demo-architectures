# Demo 08 — partner tenant entitlements (must live in ai-tenant-partner after MaasTenantConfig exists).
# Catalog:
#   partner-mistral-7b  → ai-tenant-partner (colocated with MaasTenantConfig)
#   partner-llama-3-1-8b → llm-partner (control / pre-fix layout)
# Owners: maas-demo-apps (bob).
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo08-partner-catalog
  namespace: ai-tenant-partner
  labels:
    maas.demo/tenant: partner
  annotations:
    openshift.io/display-name: "Partner apps catalog"
    openshift.io/description: "Quota for apps team on partner Mistral + Llama simulators"
spec:
  owner:
    groups:
      - name: maas-admin
      - name: maas-demo-apps
    users: []
  modelRefs:
    - name: partner-mistral-7b
      namespace: ai-tenant-partner
      tokenRateLimits:
        - limit: 400
          window: 1m
    - name: partner-llama-3-1-8b
      namespace: llm-partner
      tokenRateLimits:
        - limit: 400
          window: 1m
  priority: 40
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo08-partner-access
  namespace: ai-tenant-partner
  labels:
    maas.demo/tenant: partner
  annotations:
    openshift.io/display-name: "Partner apps access"
spec:
  modelRefs:
    - name: partner-mistral-7b
      namespace: ai-tenant-partner
    - name: partner-llama-3-1-8b
      namespace: llm-partner
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-apps
    users: []
