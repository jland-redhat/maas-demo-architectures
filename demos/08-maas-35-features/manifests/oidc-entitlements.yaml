# Demo 08 — OIDC tenant entitlements in ai-tenant-oidc.
# Group names match upstream Keycloak test realm tenant-a (NOT OpenShift Groups):
#   https://github.com/opendatahub-io/models-as-a-service/tree/main/docs/samples/install/keycloak/test-realms
# alice_lead → Engineering, Project-Alpha
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo08-oidc-catalog
  namespace: ai-tenant-oidc
  labels:
    maas.demo/tenant: oidc
  annotations:
    openshift.io/display-name: "OIDC Engineering catalog"
    openshift.io/description: "Quota for Engineering / Project-Alpha from Keycloak realm tenant-a"
spec:
  owner:
    groups:
      - name: maas-admin
      - name: Engineering
      - name: Project-Alpha
    users: []
  modelRefs:
    - name: oidc-qwen-2-5-7b
      namespace: llm-oidc
      tokenRateLimits:
        - limit: 300
          window: 1m
    - name: oidc-gpt-oss-20b
      namespace: llm-oidc
      tokenRateLimits:
        - limit: 300
          window: 1m
  priority: 40
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo08-oidc-access
  namespace: ai-tenant-oidc
  labels:
    maas.demo/tenant: oidc
  annotations:
    openshift.io/display-name: "OIDC Engineering access"
spec:
  modelRefs:
    - name: oidc-qwen-2-5-7b
      namespace: llm-oidc
    - name: oidc-gpt-oss-20b
      namespace: llm-oidc
  subjects:
    groups:
      - name: maas-admin
      - name: Engineering
      - name: Project-Alpha
    users: []
