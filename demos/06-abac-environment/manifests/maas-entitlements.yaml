# Demo 06: tokenMetadata + meteringMetadata across a five-model prod subscription
# and three policies with different chargeback labels.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo06-subscription-prod
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 06 — Prod catalog (metering labels)"
spec:
  owner:
    groups:
      - name: maas-admin
      - name: maas-demo-apps
      - name: maas-demo-research
      - name: maas-demo-restricted
    users: []
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
    - name: llama-3-1-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
    - name: mistral-7b-instruct-v03
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
    - name: qwen2-5-7b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
    - name: gpt-oss-20b-sample
      namespace: llm
      tokenRateLimits:
        - limit: 50
          window: 1m
  priority: 40
  tokenMetadata:
    organizationId: acme-corp-demo
    costCenter: "4410"
    labels:
      env: prod
      data_class: internal
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo06-policy-research
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
    - name: qwen2-5-7b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-research
    users: []
  meteringMetadata:
    organizationId: acme-corp-demo
    costCenter: "4410"
    labels:
      team: research
      chargeback: rnd-llm
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo06-policy-apps
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
    - name: mistral-7b-instruct-v03
      namespace: llm
    - name: gpt-oss-20b-sample
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-apps
    users: []
  meteringMetadata:
    organizationId: acme-corp-demo
    costCenter: "5520"
    labels:
      team: apps
      chargeback: app-llm
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo06-policy-restricted
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-restricted
    users: []
  meteringMetadata:
    organizationId: acme-corp-demo
    costCenter: "6600"
    labels:
      team: restricted
      chargeback: low-risk-llm
