# Demo 06: tokenMetadata (subscription) + meteringMetadata (policy) for attribution labels.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo06-subscription-prod
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 06 — Prod catalog (labeled)"
spec:
  owner:
    groups:
      - name: maas-demo-apps
      - name: maas-demo-research
    users: []
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 60000
          window: 1m
  priority: 40
  tokenMetadata:
    organizationId: acme-corp-demo
    costCenter: "4410"
    labels:
      env: prod
      data_class: internal
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo06-policy-research-prod
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-demo-research
    users: []
  meteringMetadata:
    organizationId: acme-corp-demo
    costCenter: "4410"
    labels:
      team: research
      chargeback: rnd-llm
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo06-policy-apps-prod
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-demo-apps
    users: []
  meteringMetadata:
    organizationId: acme-corp-demo
    costCenter: "5520"
    labels:
      team: apps
      chargeback: app-llm
