# Demo 05: Tier subscription with stricter per-model token limits on expensive routes.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo05-tier-metered
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 05 — Gold tier with uneven per-model quotas"
spec:
  owner:
    groups:
      - name: maas-demo-research
      - name: maas-demo-apps
    users: []
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 80000
          window: 1m
    - name: llama-3-1-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 80000
          window: 1m
    - name: gpt-oss-20b-sample
      namespace: llm
      tokenRateLimits:
        - limit: 15000
          window: 1m
  priority: 55
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo05-research-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
    - name: gpt-oss-20b-sample
      namespace: llm
  subjects:
    groups:
      - name: maas-demo-research
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo05-apps-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-demo-apps
    users: []
