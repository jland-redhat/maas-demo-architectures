# Demo 05: Full five-model subscription with uneven per-model token limits + three team policies.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo05-tier-metered
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 05 — Metered tier (all models, uneven caps)"
spec:
  owner:
    groups:
      - name: maas-admin
      - name: maas-demo-research
      - name: maas-demo-apps
      - name: maas-demo-restricted
    users: []
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
    - name: llama-3-1-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
    - name: mistral-7b-instruct-v03
      namespace: llm
      tokenRateLimits:
        - limit: 500
          window: 1m
    - name: qwen2-5-7b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
    - name: gpt-oss-20b-sample
      namespace: llm
      tokenRateLimits:
        - limit: 50
          window: 1m
  priority: 55
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo05-research-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
    - name: qwen2-5-7b-instruct
      namespace: llm
    - name: gpt-oss-20b-sample
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-research
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo05-apps-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
    - name: mistral-7b-instruct-v03
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-apps
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo05-restricted-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
    - name: mistral-7b-instruct-v03
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-restricted
    users: []
