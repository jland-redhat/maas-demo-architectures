# Demo 09 — llm-d Endpoint Picker (EPP) smoke lab.
#
# Dedicated LLMInferenceService (do not patch e2e fixtures). Enables the
# managed router scheduler so KServe creates InferencePool + EPP, and runs
# ≥3 simulator replicas so scheduling has more than one endpoint to choose.
#
# Image / args match deploy/base/inference/simulators.yaml (llm-d-inference-sim).
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: demo09-epp-sim
  namespace: llm
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
    maas.demo/model-family: epp
    maas.demo/demo: "09"
  annotations:
    openshift.io/display-name: "Demo 09 EPP sim (3 replicas + scheduler)"
spec:
  model:
    uri: hf://sshleifer/tiny-gpt2
    name: demo/epp-sim
  replicas: 3
  router:
    route: {}
    # Empty object = managed EPP + InferencePool (Gateway API Inference Extension).
    scheduler: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
        imagePullPolicy: Always
        command: ["/app/llm-d-inference-sim"]
        args:
          - --port
          - "8000"
          - --model
          - demo/epp-sim
          - --mode
          - random
          - --max-model-len
          - "32768"
          - --log-http
          - --force-dummy-tokenizer
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
        ports:
          - name: https
            containerPort: 8000
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: https
            scheme: HTTPS
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: demo09-epp-sim
  namespace: llm
  labels:
    app.kubernetes.io/part-of: maas-demo-architectures
    maas.demo/demo: "09"
  annotations:
    openshift.io/display-name: "Demo 09 EPP sim (llm-d scheduler)"
spec:
  modelRef:
    kind: LLMInferenceService
    name: demo09-epp-sim
