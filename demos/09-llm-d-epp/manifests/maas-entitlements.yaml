# Demo 09: paired subscription + policy for the EPP simulator.
# High tokenRateLimits so burst probes are not capped at 100/min (free-tier trap).
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo09-epp-catalog
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 09 — llm-d EPP catalog"
    openshift.io/description: "Quota for the multi-replica EPP simulator"
spec:
  owner:
    groups:
      - name: maas-admin
      - name: maas-demo-research
    users: []
  modelRefs:
    - name: demo09-epp-sim
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
  priority: 45
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo09-epp-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 09 — llm-d EPP access"
spec:
  modelRefs:
    - name: demo09-epp-sim
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-research
    users: []
