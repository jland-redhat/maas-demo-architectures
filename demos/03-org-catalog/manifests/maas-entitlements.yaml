# Demo 03: One enterprise catalog subscription (all models) + multiple team policies
# + optional admin policy for break-glass visibility.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo03-org-catalog
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 03 — Enterprise catalog (full platform)"
spec:
  owner:
    groups:
      - name: maas-admin
      - name: maas-demo-org
    users: []
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
    - name: llama-3-1-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
    - name: mistral-7b-instruct-v03
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
    - name: qwen2-5-7b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
    - name: gpt-oss-20b-sample
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
  priority: 50
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo03-research-slice
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
    - name: qwen2-5-7b-instruct
      namespace: llm
    - name: gpt-oss-20b-sample
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-research
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo03-apps-slice
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
    - name: mistral-7b-instruct-v03
      namespace: llm
    - name: gpt-oss-20b-sample
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-apps
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo03-restricted-slice
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-restricted
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo03-admins-slice
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 03 — Admins: full catalog access"
spec:
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
    - name: llama-3-1-8b-instruct
      namespace: llm
    - name: mistral-7b-instruct-v03
      namespace: llm
    - name: qwen2-5-7b-instruct
      namespace: llm
    - name: gpt-oss-20b-sample
      namespace: llm
  subjects:
    groups:
      - name: maas-admin
      - name: maas-demo-admins
    users: []
