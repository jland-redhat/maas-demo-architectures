# Demo 04: One subscription per model (SKU); same owner group on all; distinct priority.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo04-sku-granite
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 04 — SKU: Granite"
spec:
  owner:
    groups:
      - name: maas-demo-research
    users: []
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 40000
          window: 1m
  priority: 30
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo04-sku-llama
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 04 — SKU: Llama"
spec:
  owner:
    groups:
      - name: maas-demo-research
    users: []
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 40000
          window: 1m
  priority: 25
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo04-sku-mistral
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 04 — SKU: Mistral"
spec:
  owner:
    groups:
      - name: maas-demo-research
    users: []
  modelRefs:
    - name: mistral-7b-instruct-v03
      namespace: llm
      tokenRateLimits:
        - limit: 40000
          window: 1m
  priority: 20
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo04-access-granite
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-demo-research
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo04-access-llama
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-demo-research
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo04-access-mistral
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: mistral-7b-instruct-v03
      namespace: llm
