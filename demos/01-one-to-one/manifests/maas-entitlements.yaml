# Demo 01: Five paired entitlements — each MaaSSubscription + MaaSAuthPolicy shares one OpenShift
# group (owner = subjects). This file uses one model per pair for clarity; the same pattern
# supports many modelRefs per pair (bundle SKU). Namespace: models-as-a-service.
# Requires MaaSModelRef for each name below in namespace llm.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo01-line-granite
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 01 — Line item: Granite"
spec:
  owner:
    groups:
      - name: maas-demo-line-granite
    users: []
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
  priority: 22
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo01-access-granite
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-demo-line-granite
    users: []
---
