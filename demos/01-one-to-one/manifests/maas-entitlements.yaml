# Demo 01: One subscription + one auth policy per model (namespace models-as-a-service).
# Requires MaaSModelRef objects in llm: granite-3-8b-instruct, llama-3-1-8b-instruct, mistral-7b-instruct-v03
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo01-granite-subscription
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 01 — Granite line item"
spec:
  owner:
    groups:
      - name: maas-demo-research
    users: []
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 50000
          window: 1m
  priority: 20
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo01-granite-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 01 — Granite access (research)"
spec:
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-demo-research
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo01-llama-subscription
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 01 — Llama line item"
spec:
  owner:
    groups:
      - name: maas-demo-apps
    users: []
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 50000
          window: 1m
  priority: 20
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo01-llama-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 01 — Llama access (apps)"
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-demo-apps
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo01-mistral-subscription
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 01 — Mistral line item"
spec:
  owner:
    groups:
      - name: maas-demo-restricted
    users: []
  modelRefs:
    - name: mistral-7b-instruct-v03
      namespace: llm
      tokenRateLimits:
        - limit: 50000
          window: 1m
  priority: 20
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo01-mistral-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 01 — Mistral access (restricted)"
spec:
  modelRefs:
    - name: mistral-7b-instruct-v03
      namespace: llm
  subjects:
    groups:
      - name: maas-demo-restricted
    users: []
