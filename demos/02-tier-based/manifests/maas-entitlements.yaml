# Demo 02: Single tier subscription (multi-model) + per-team auth policies.
# All owner groups receive quota on all tier models; policies limit which models each team may call.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo02-tier-gold
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 02 — Gold tier (multi-model)"
spec:
  owner:
    groups:
      - name: maas-demo-research
      - name: maas-demo-apps
      - name: maas-demo-restricted
    users: []
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 100000
          window: 1m
    - name: llama-3-1-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 100000
          window: 1m
    - name: mistral-7b-instruct-v03
      namespace: llm
      tokenRateLimits:
        - limit: 100000
          window: 1m
    - name: qwen2-5-7b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 100000
          window: 1m
    - name: gpt-oss-20b-sample
      namespace: llm
      tokenRateLimits:
        - limit: 100000
          window: 1m
  priority: 50
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo02-research-slice
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 02 — Research may use Granite + Qwen"
spec:
  modelRefs:
    - name: granite-3-8b-instruct
      namespace: llm
    - name: qwen2-5-7b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-demo-research
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo02-apps-slice
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 02 — Apps may use Llama + Mistral"
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
    - name: mistral-7b-instruct-v03
      namespace: llm
  subjects:
    groups:
      - name: maas-demo-apps
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: demo02-restricted-slice
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Demo 02 — Restricted may use Llama only"
spec:
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
  subjects:
    groups:
      - name: maas-demo-restricted
    users: []
